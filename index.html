<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Masar X - منصة إدارة نقل الطلاب والرحلات" />

    <!-- 🚫 منع المتصفح والتطبيق المثبت من حفظ نسخ قديمة (Fix PWA Freeze) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- 📱 ربط ملف التثبيت المباشر للهاتف (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مسار إكس" />

    <title>Masar X - مسار X</title>

    <!-- خط تجوال العربي الاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🔔 OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "c05c83a1-9a4e-43ec-944a-957d051e7192",
          notifyButton: { enable: false },
        });
      });
    </script>

    <!-- ⚡ سكريبت معالجة عدم التحديث في التطبيق المثبت مع الحفاظ على إشعارات OneSignal -->
    <script>
      // 1️⃣ مسح ملفات التخزين المؤقت القديمة مع استثناء ملف إشعارات OneSignal
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            const scriptUrl = registration.active?.scriptURL || registration.waiting?.scriptURL || '';
            if (!scriptUrl.includes('OneSignal')) {
              registration.unregister();
            }
          }
        });
      }

      // 2️⃣ إجبار التطبيق على إعادة الاتصال والتحديث فور الفتح من الخلفية
      let lastLeaveTime = 0;
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          lastLeaveTime = Date.now();
        } else if (document.visibilityState === 'visible') {
          // إذا ترك المستخدم التطبيق في الخلفية لأكثر من 5 ثوانٍ، يتم عمل التحديث تلقائياً
          if (lastLeaveTime && Date.now() - lastLeaveTime > 5000) {
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 font-['Tajawal',sans-serif] antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
